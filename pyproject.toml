[project]
name = "audiobooks"
version = "0.1.0"
description = "AI audiobook generator: EPUB to audiobook with Chatterbox TTS and chaptered M4B export"
keywords = ["ai-audiobook-generator", "epub-to-audiobook", "text-to-speech", "chatterbox", "m4b", "codex-plugin"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@master",
    "ebooklib>=0.20",
    "faster-whisper>=1.2.1",
    "lxml>=6.1.3",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "panflute>=2.3.1",
    "pydantic>=2.13.5",
    "pypandoc-binary>=1.17",
    "soundfile>=0.14.0",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://fredfortier.github.io/ai-audiobook-generator/"
Repository = "https://github.com/fredfortier/ai-audiobook-generator"
Documentation = "https://fredfortier.github.io/ai-audiobook-generator/#install"
Issues = "https://github.com/fredfortier/ai-audiobook-generator/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "black>=26.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B009", "B010", "RUF059"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]
