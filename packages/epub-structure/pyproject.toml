[project]
name = "epub-structure"
version = "0.1.0"
description = "EPUB reading order, navigation evidence, and section reconciliation."
license = "MIT"
requires-python = ">=3.13"
dependencies = ["ebooklib>=0.20", "lxml>=6.1.3", "pydantic>=2.13.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
