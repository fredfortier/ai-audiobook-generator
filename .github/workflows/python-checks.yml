name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Tests
            command: python -m pytest -q
          - check: Types
            command: basedpyright src tests
          - check: Lint
            command: ruff check .
          - check: Formatting
            command: black --check .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run ${{ matrix.check }}
        run: uv run --no-sync ${{ matrix.command }}
